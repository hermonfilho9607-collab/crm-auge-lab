<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>CRM Auge Lab</title>
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // aplica o tema antes de pintar, para não piscar
    try { const t = localStorage.getItem('crm.tema'); if (t && t !== 'auto') document.documentElement.dataset.tema = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <div class="app">
    <aside class="lateral">
      <div class="marca">
        <img class="marca-logo" src="icone.svg" alt="" width="32" height="32">
        <div class="marca-texto"><strong>Auge Lab</strong><span>CRM de prospecção</span></div>
      </div>
      <button class="btn btn-primario btn-novo" id="btn-novo" type="button" aria-label="Novo contato" aria-keyshortcuts="n">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></span>
        <span class="btn-novo-texto">Novo contato</span>
      </button>
      <nav class="nav" aria-label="Principal">
        <ul>
          <li><a href="#/hoje" data-rota="hoje">
            <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/></svg></span>
            <span>Hoje</span><span class="nav-selo" hidden></span></a></li>
          <li><a href="#/funil" data-rota="funil">
            <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v11M12 5v6M18 5v14"/></svg></span>
            <span>Funil</span></a></li>
          <li><a href="#/contatos" data-rota="contatos">
            <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
            <span>Contatos</span></a></li>
          <li><a href="#/dados" data-rota="dados">
            <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg></span>
            <span>Dados</span></a></li>
        </ul>
      </nav>
      <div class="lateral-rodape">
        <p id="status" class="status" role="status" data-estado="carregando"><span class="status-ponto" aria-hidden="true"></span><span class="status-texto">Carregando…</span></p>
        <button id="btn-tema" class="btn-icone" type="button" aria-label="Alternar tema"></button>
      </div>
      <p class="atalhos"><kbd>N</kbd> novo contato · <kbd>/</kbd> buscar</p>
    </aside>
    <main id="conteudo" class="conteudo" tabindex="-1"></main>
  </div>

  <dialog id="gaveta" class="gaveta" aria-labelledby="gaveta-titulo">
    <div class="gaveta-corpo"></div>
  </dialog>
  <div id="avisos" class="avisos" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
